<!doctype html>
<!--
  The splash.

  It exists for the gap between "the process started" and "the window can be
  used": migrations, the vault, the first read of the tree. That gap is short
  on a warm start and several seconds on a cold one, and for all of it the app
  was previously nothing at all — no window, no taskbar hint, no sign that the
  thing you double-clicked heard you.

  Deliberately a plain file: no framework, no Tauri call, and the only script
  is four synchronous lines reading the last known palette. It has to paint on
  the very first frame, and anything it waited for would be the thing it is
  covering. Rust closes it; it cannot close itself, and it must never be the
  reason the app looks stuck.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DevDeck</title>
    <style>
      /* The default theme's panel and ink. The script below replaces them
         with whatever you actually chose, before the first paint. */
      :root {
        --panel: #11141c;
        --ink: #e2e8f0;
        --brand: #863bff;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        cursor: default;
        user-select: none;
      }

      .card {
        box-sizing: border-box;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 26px 30px 22px;
        /* Grey at low alpha reads as an edge on a near-black panel and on a
           paper-white one alike, which no fixed line colour can do — and the
           panel colour here comes from whichever of six themes you last used. */
        border: 1px solid rgba(128, 128, 140, 0.24);
        border-radius: 14px;
        background: var(--panel);
        box-shadow:
          0 18px 50px rgba(0, 0, 0, 0.45),
          0 2px 8px rgba(0, 0, 0, 0.25);
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      /* The mark, lit from behind. One shape, the app's own. */
      .mark {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .mark::after {
        content: "";
        position: absolute;
        inset: -22px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(134, 59, 255, 0.22), transparent 70%);
        animation: breathe 2.4s ease-in-out infinite;
      }
      .mark svg {
        position: relative;
        width: 40px;
        height: 38px;
        display: block;
      }

      .name {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--ink);
      }
      .what {
        margin-top: -8px;
        font-size: 11.5px;
        color: var(--ink);
        opacity: 0.55;
      }

      /* An indeterminate bar, because nothing here knows a percentage and a
         fake one would be a lie told at the very first moment. */
      .track {
        width: 172px;
        height: 2px;
        border-radius: 2px;
        background: rgba(128, 128, 140, 0.22);
        overflow: hidden;
      }
      .bar {
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, var(--brand), transparent);
        animation: sweep 1.25s ease-in-out infinite;
      }

      @keyframes sweep {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(360%);
        }
      }
      @keyframes breathe {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.94);
        }
        50% {
          opacity: 1;
          transform: scale(1.06);
        }
      }

      /* Somebody who turned animation off gets a still window, not a jitter. */
      @media (prefers-reduced-motion: reduce) {
        .bar,
        .mark::after {
          animation: none;
        }
        .bar {
          width: 100%;
          background: var(--brand);
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <script>
      // The one piece of script here, and it is four lines because it runs
      // before the first paint: the palette the app last used, left in browser
      // storage by rememberForSplash(). Missing, blocked or malformed all fall
      // through to the dark default above, which is what a fresh profile gets.
      try {
        var s = JSON.parse(localStorage.getItem('devdeck.splash') || 'null')
        if (s && s.panel) {
          var r = document.documentElement.style
          r.setProperty('--panel', s.panel)
          r.setProperty('--ink', s.ink)
          r.setProperty('--brand', s.accent)
        }
      } catch (e) {}
    </script>
    <div class="card">
      <div class="mark">
        <svg viewBox="0 0 48 46" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path
            fill="#863bff"
            d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z"
          />
        </svg>
      </div>
      <div class="name">DevDeck</div>
      <div class="what">Starting your deck</div>
      <div class="track"><div class="bar"></div></div>
    </div>
  </body>
</html>
