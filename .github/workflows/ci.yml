name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  onboarding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - uses: dtolnay/rust-toolchain@stable
      - name: Check subscription protocol and CLI fixtures
        run: cargo test --manifest-path harness/rust-core/Cargo.toml --locked
      - name: Check onboarding with mocked native IPC
        run: |
          npx vite --config vite.harness.config.ts --host 127.0.0.1 > /tmp/devdeck-harness.log 2>&1 &
          trap 'kill $!' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5199/harness/onboarding.html > /dev/null; then break; fi
            sleep 1
          done
          node harness/check-beta5.mjs
          node harness/check-cli-setup.mjs
          node harness/check-space-switcher.mjs
          node harness/check-onboarding.mjs
          node harness/check-folder-workflows.mjs
          HARNESS_URL=http://127.0.0.1:5199 node harness/check-visibility.mjs
          node --test scripts/session-checkpoint.test.mjs scripts/github-session-checkpoint.test.mjs

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # `tsc -b`, not `tsc --noEmit`: the root tsconfig is references-only, so
      # `--noEmit` against it compiles nothing and passes whatever is broken.
      - name: Typecheck
        run: npx tsc -b

      - name: Lint (frontend)
        run: npm run lint

      - name: Format check (Rust)
        run: cargo fmt --all --check
        working-directory: src-tauri

      # Tauri's config names this sidecar as an external binary. Clippy and
      # tests run the build script too, so stage it before either command.
      - name: Stage asker sidecar
        run: npm run ask

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Test (Rust)
        run: cargo test --workspace --all-targets
        working-directory: src-tauri

      - name: Build app
        run: npx tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: devdeck-windows
          path: |
            src-tauri/target/release/devdeck.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: warn
