[package]
name = "devdeck"
version = "0.2.9"
description = "DevDeck — local development command center"
authors = ["Develtech"]
license = "MIT"
repository = "https://github.com/d3velopm3nt/devdeck"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "devdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
portable-pty = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
sysinfo = "0.39"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-process = "2"

[profile.release]
opt-level = 2
lto = true
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# Stash's clipboard capture: a message-only window listening for
# WM_CLIPBOARDUPDATE (event-driven — we never poll the clipboard).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
