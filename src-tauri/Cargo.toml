[package]
name = "devdeck"
version = "0.2.9"
description = "DevDeck — local development command center"
authors = ["Develtech"]
license = "MIT"
repository = "https://github.com/d3velopm3nt/devdeck"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "devdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
portable-pty = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
sysinfo = "0.39"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-process = "2"
# Screenshot thumbnails: decode + downscale only. Default features would drag
# in every format decoder for no benefit.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
opt-level = 2
lto = true
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# Stash's clipboard capture: a message-only window listening for
# WM_CLIPBOARDUPDATE (event-driven — we never poll the clipboard).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Screenshot OCR uses WinRT (Windows.Media.Ocr), which needs the projected
# `windows` crate rather than the raw `windows-sys` bindings above. 0.62 is
# already in the tree via tauri, so this reuses that copy.
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
    "Win32_System_Com",
] }
