[package]
name = "devdeck-connector-checks"
version = "0.1.0"
edition = "2021"
[lib]
path = "lib.rs"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
quick-xml = "0.41"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
