[package]
name = "term-widget"
version = "0.1.0"
edition = "2021"
description = "Always-on-top terminal launcher widget with global hotkey"

[dependencies]
eframe = "0.31"
egui = "0.31"
global-hotkey = "0.8"
raw-window-handle = "0.6"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[profile.release]
opt-level = 3
lto = true
strip = true
