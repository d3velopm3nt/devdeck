<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: #11141c; }
    a { color: #818cf8; } a:hover { color: #a5b4fc; }
    .row {
      display: flex; align-items: center; gap: 6px;
      padding: 2px 6px; border-radius: 4px;
      font-size: 12.5px; color: #cbd5e1; white-space: nowrap;
    }
    .chev { display: flex; width: 20px; flex: none; align-items: center; justify-content: center; color: #94a3b8; }
    .ico  { display: flex; width: 20px; flex: none; align-items: center; justify-content: center; }
    .cat {
      display: flex; align-items: center; gap: 6px;
      padding: 2px 6px; margin-top: 2px; border-radius: 4px;
      font-size: 11.5px; font-weight: 500; color: #94a3b8;
      text-transform: uppercase; letter-spacing: 0.025em;
    }
    .count { margin-left: auto; padding-right: 4px; font-size: 10.5px; color: #475569; font-variant-numeric: tabular-nums; }
    .sub {
      padding-left: 48px; font-size: 10px; color: #475569;
      font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
    }
  </style>
</helmet>

<div style="width: 280px; height: 680px; background: #11141c; border-right: 1px solid #1e293b; display: flex; flex-direction: column">

  <div style="display: flex; align-items: center; gap: 8px; flex: none; padding: 8px 10px; border-bottom: 1px solid #1e293b">
    <span style="font-size: 10.5px; font-weight: 600; letter-spacing: 0.07em; color: #64748b">EXPLORER</span>
  </div>

  <!-- THE CHANGE: the solution is the frame, chosen here -->
  <div style="flex: none; padding: 7px 8px; border-bottom: 1px solid #1e293b; background: #151923">
    <div style="display: flex; align-items: center; gap: 7px; border-radius: 5px; padding: 4px 6px; background: rgb(167 139 250 / 0.10); box-shadow: inset 0 0 0 1px rgb(167 139 250 / 0.22)">
      <span style="display: flex; color: #a78bfa"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m6.08 9.5-3.5 1.6a1 1 0 0 0 0 1.81l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9a1 1 0 0 0 0-1.83l-3.5-1.59"/><path d="m6.08 14.5-3.5 1.6a1 1 0 0 0 0 1.81l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9a1 1 0 0 0 0-1.83l-3.5-1.59"/></svg></span>
      <span style="font-size: 12.5px; font-weight: 600; color: #e2e8f0">TyreX</span>
      <span style="margin-left: auto; display: flex; color: #94a3b8"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
    </div>
  </div>

  <div style="padding: 6px 4px; display: flex; flex-direction: column; gap: 1px; overflow: hidden">

    <!-- Features: a sibling of Projects now, not buried inside one -->
    <div class="cat" style="padding-left: 6px">
      <span class="chev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
      <span class="ico" style="color: #818cf8"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M3 6h.01"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M8 6h13"/></svg></span>
      <span style="flex: 1">Features</span>
      <span class="count">3</span>
    </div>

    <div class="row" style="padding-left: 26px">
      <span class="ico"><span style="width: 6px; height: 6px; border-radius: 50%; background: #4ade80"></span></span>
      <span>Dark mode</span>
    </div>
    <div class="sub">web · mobile · desktop</div>

    <div class="row" style="padding-left: 26px">
      <span class="ico"><span style="width: 6px; height: 6px; border-radius: 50%; background: #fbbf24"></span></span>
      <span>Offline sync</span>
    </div>
    <div class="sub">api · mobile</div>

    <div class="row" style="padding-left: 26px">
      <span class="ico"><span style="width: 6px; height: 6px; border-radius: 50%; background: #64748b"></span></span>
      <span>Token refresh</span>
    </div>
    <div class="sub">api</div>

    <!-- Projects -->
    <div class="cat" style="padding-left: 6px; margin-top: 10px">
      <span class="chev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
      <span class="ico" style="color: #38bdf8"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg></span>
      <span style="flex: 1">Projects</span>
      <span class="count">3</span>
    </div>

    <div class="row" style="padding-left: 20px">
      <span class="chev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
      <span class="ico" style="color: #38bdf8"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg></span>
      <span>tyrex-api</span>
    </div>
    <div class="row" style="padding-left: 20px">
      <span class="chev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
      <span class="ico" style="color: #38bdf8"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg></span>
      <span>tyrex-web</span>
    </div>

    <div class="cat" style="padding-left: 34px; text-transform: uppercase">
      <span class="chev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
      <span class="ico" style="color: #4ade80"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m13 2-3 7h6l-3 7"/></svg></span>
      <span style="flex: 1">Services</span>
      <span class="count">4</span>
    </div>
    <div class="cat" style="padding-left: 34px">
      <span class="chev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
      <span class="ico" style="color: #94a3b8"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 9 3 3-3 3"/></svg></span>
      <span style="flex: 1">Commands</span>
      <span class="count">12</span>
    </div>

    <div class="row" style="padding-left: 20px">
      <span class="chev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
      <span class="ico" style="color: #38bdf8"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg></span>
      <span>tyrex-mobile</span>
    </div>

  </div>

  <div style="margin-top: auto; border-top: 1px solid #1e293b; padding: 9px 10px; font-size: 10.5px; line-height: 1.5; color: #475569">
    Features sit beside Projects, not inside one. Pick the
    solution once; everything below is scoped to it.
  </div>
</div>
</x-dc>
</body>
</html>
