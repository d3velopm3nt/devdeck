name: Release

# Release a new version after CI passes on main. Tags and manual runs remain
# available; existing tags are never moved to another commit.
#
# Code signing is OPTIONAL and plug-and-play: if the SignPath repository
# variables/secret are configured (see SIGNING.md), the installer is signed by
# SignPath Foundation before it's published. If they're not set, the installer
# is published unsigned exactly as before — so releases keep working either way.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.1.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: devdeck-release
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        with:
          script: |
            const fs = require('node:fs');
            const { execFileSync } = require('node:child_process');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) {
              throw new Error('Invalid release version');
            }
            const tag = `v${version}`;
            const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            const requested = context.eventName === 'workflow_dispatch'
              ? process.env.REQUESTED_TAG
              : context.eventName === 'push' ? context.ref.replace('refs/tags/', '') : tag;
            if (requested !== tag) throw new Error('Requested tag does not match package.json');
            const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).version;
            const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8')
              .match(/\[package\][\s\S]*?^version\s*=\s*"([^"]+)"/m)?.[1];
            if (tauri !== version || cargo !== version) throw new Error('Release versions differ');
            let existing;
            try {
              existing = await github.rest.repos.getCommit({ ...context.repo, ref: tag });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (context.eventName === 'workflow_run' && existing) {
              core.notice(`${tag} already exists; no new release`);
              core.setOutput('publish', 'false');
              return;
            }
            if (existing && existing.data.sha !== sha) {
              throw new Error('Existing tag points to another commit; select that ref or bump the version');
            }
            core.setOutput('publish', 'true');
            core.setOutput('tag', tag);
            core.setOutput('sha', sha);

  release:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      # True when SignPath signing is configured for this repo.
      SIGN: ${{ vars.SIGNPATH_PROJECT_SLUG != '' }}
      DEVDECK_GITHUB_CLIENT_ID: ${{ vars.DEVDECK_GITHUB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # Build the NSIS installer (build only — we publish the release ourselves
      # further down, after optionally signing). Updater artifacts (the minisign
      # .sig the in-app updater verifies) are enabled here — not in the shared
      # config — so CI/PR builds don't need the signing key. The signing key
      # secret makes this build emit the .sig.
      - name: Build installer
        shell: pwsh
        run: npx tauri build --config src-tauri/tauri.conf.updater.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Locate installer
        id: installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $exe) { throw "No NSIS installer found under src-tauri/target/release/bundle/nsis" }
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($exe.Name)" >> $env:GITHUB_OUTPUT

      # ---- SignPath Foundation signing (only when configured) ----
      - name: Upload unsigned installer
        if: ${{ env.SIGN == 'true' }}
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error

      - name: Sign with SignPath
        if: ${{ env.SIGN == 'true' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      # Pick the signed installer when signing ran, otherwise the raw build.
      - name: Select installer to publish
        id: final
        shell: pwsh
        run: |
          if ($env:SIGN -eq 'true') {
            $exe = Get-ChildItem signed/*-setup.exe | Select-Object -First 1
            if (-not $exe) { throw "Signed installer not found under signed/" }
            "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          } else {
            "path=${{ steps.installer.outputs.path }}" >> $env:GITHUB_OUTPUT
          }

      # Updater manifest for the in-app (signed) self-update. The .sig is emitted
      # by `tauri build` next to the installer. NOTE: if SignPath re-signs the
      # installer (SIGN=true), its bytes change and this build-time .sig no longer
      # matches — a re-sign step would be needed; for unsigned builds it's exact.
      - name: Generate updater manifest (latest.json)
        if: ${{ env.SIGN != 'true' }}
        shell: pwsh
        run: |
          $sig = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe.sig -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sig) { throw "No .sig found — is the TAURI_SIGNING_PRIVATE_KEY secret set?" }
          $name = "${{ steps.installer.outputs.name }}"
          $ver  = "${{ env.TAG }}".TrimStart('v')
          $url  = "https://github.com/d3velopm3nt/devdeck/releases/download/${{ env.TAG }}/$name"
          $manifest = [ordered]@{
            version   = $ver
            notes     = "See the release notes at https://github.com/d3velopm3nt/devdeck/releases/tag/${{ env.TAG }}"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{ signature = (Get-Content $sig.FullName -Raw).Trim(); url = $url } }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content latest.json -Encoding utf8
          Get-Content latest.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: DevDeck ${{ env.TAG }}
          draft: false
          prerelease: ${{ contains(env.TAG, '-') }}
          make_latest: ${{ !contains(env.TAG, '-') }}
          files: |
            ${{ steps.final.outputs.path }}
            latest.json
          body: |
            ### Install

            Download **`DevDeck_*_x64-setup.exe`** below and run it.

            > **Note on SmartScreen:** if the download isn't signed yet, Windows may
            > warn "Windows protected your PC". Click **More info → Run anyway**, or
            > build from source. (Signed builds via SignPath Foundation clear this.)

            First run? Click **Load example workspace** on the welcome screen — it
            creates a small demo project with a real web server and a background
            worker so you can see DevDeck work before wiring up your own repos.

            **Requirements:** Windows 10/11 (x64). No runtime to install.
