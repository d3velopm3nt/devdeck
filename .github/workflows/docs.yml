name: Documentation
on:
  pull_request:
    paths: ['apps/docs/**', 'docs/**', 'package.json', 'package-lock.json', '.github/workflows/docs.yml']
  push:
    branches: [main, master]
    paths: ['apps/docs/**', 'docs/**', 'package.json', 'package-lock.json', '.github/workflows/docs.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - uses: actions/upload-artifact@v4
        with:
          name: devdeck-docs
          path: dist-docs/
