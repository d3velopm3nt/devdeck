# The asking half of a worker run, as its own binary.
#
# It is a separate crate for one measured reason: a bin target in the same
# package is relinked whenever the package's lib changes — even a bin that
# never mentions the lib — and a running copy makes the whole build fail with
# "failed to remove file … Access is denied". So while a worker was waiting at
# a question, `cargo` could not replace `devdeck.exe`, and editing anything
# under `src-tauri` either blocked the build or restarted the app underneath a
# live run. As its own crate it is only rebuilt when *its* sources change,
# which is almost never.
#
# Dependencies stay at three on purpose. This process must start in
# milliseconds, hold no database, open no window, and keep working when the app
# it was spawned by has been replaced by a newer build.
[package]
name = "devdeck-ask"
version = "0.3.1"
description = "DevDeck's permission asker: the half of a worker run that waits for a person"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
name = "devdeck_ask"
path = "src/lib.rs"

[[bin]]
name = "devdeck-ask"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
